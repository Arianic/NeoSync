name: NeoSync Linux verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install desktop test services
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 gnome-keyring libsecret-1-0 libgtk-3-0t64 libnss3 libasound2t64 xz-utils binutils
      - run: npm ci
      - name: Install Electron runtime and configure its sandbox helper
        run: |
          node -e "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm test
      - name: Lint sync integration
        run: npx --no-install oxlint sync scripts/sync*.js preload.js
      - name: Reject the unprotected fallback
        run: xvfb-run -a env NEOSYNC_EXPECT_KEYRING=basic_text npm run test:sync:keyring -- --password-store=basic
      - name: Real keyring and desktop smoke, isolated from user data
        run: |
          xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
            export XDG_DATA_HOME="$(mktemp -d)"
            export XDG_CONFIG_HOME="$(mktemp -d)"
            export XDG_RUNTIME_DIR="$(mktemp -d)"
            export XDG_CURRENT_DESKTOP=GNOME
            printf "%s" "disposable-test-keyring" | gnome-keyring-daemon --unlock --components=secrets
            npm run test:sync:keyring -- --password-store=gnome-libsecret
            npm run test:sync:desktop -- --password-store=gnome-libsecret
            npm run test:sync:restart -- --password-store=gnome-libsecret
            npm run test:sync:ui -- --password-store=gnome-libsecret
          '
      - name: Package AppImage and Debian installer (no publishing)
        run: npm run package:linux:x64
      - name: Hash Linux installers
        run: cd dist && sha256sum *.AppImage *.deb > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NeoSync-Linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error
