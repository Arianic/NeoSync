name: NeoSync desktop
on:
  push:
    branches: [main]
    tags: ['neosync-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate release metadata
        run: node scripts/check-release.js
  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx --no-install oxlint sync scripts/sync*.js preload.js
      - run: npm run test:sync:desktop
      - run: npm run test:sync:restart
      - run: npm run test:sync:ui
      - run: npm run package:win
      - name: Hash Windows installers
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -Filter '*.exe' | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content dist/SHA256SUMS-windows.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: NeoSync-Windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error
  linux:
    needs: version
    uses: ./.github/workflows/linux-sync.yml
  draft-release:
    if: startsWith(github.ref, 'refs/tags/neosync-v') && github.repository == 'Arianic/NeoSync'
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: NeoSync-*
          merge-multiple: true
          path: release-assets
      - name: Create or update draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#neosync-v}"
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release-state.json 2>/dev/null; then
            node -e "if (!require('./release-state.json').isDraft) throw Error('Published releases are never overwritten')"
          else
            flags=(--draft --verify-tag --title "NeoSync $version" --notes-file "docs/releases/$version.md")
            if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
